<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Asociación Juvenil Proyecto Dubini">
        <meta name="theme-color" content="#1e88e5">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Dubini">
        <link rel="apple-touch-icon" href="/assets/logo.png">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <link rel="manifest" href="/manifest.json">
        <title>Proyecto Dubini</title>
        <link rel="stylesheet" href="/styles/layout/header.css">
        <link rel="stylesheet" href="/styles/layout/footer.css">
        <link rel="stylesheet" href="/styles/base.css">
        <link rel="stylesheet" href="/styles/login.css">
    </head>
    <body>
        <main role="main">
            <section class="login">
                <div class="container">
                    <h2>Acceder</h2>
                    
                    <!-- Error Message -->
                    <div id="errorMessage" class="error-message" style="display: none;">
                        <span class="error-icon">⚠️</span>
                        <div>
                            <p class="error-title" id="errorTitle"></p>
                            <p class="error-text" id="errorText"></p>
                        </div>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <button type="submit" id="loginButton" class="btn btn-primary">
                                <span id="buttonText">Acceder</span>
                                <div id="spinner" class="spinner" style="display: none;"></div>
                            </button>
                        </div>
                    </form>

                    <!-- Loading Information -->
                    <div class="loading-info">
                        <p class="info-icon">ℹ️</p>
                        <p>El backoffice puede tardar hasta <strong>1 minuto</strong> en iniciarse en el primer acceso. (Si tarda demasiado avisa a franchu)</p>
                    </div>
                </div>
            </section>
        </main>
        </body>
        <script src="/scripts/script.js"></script>
        <script src="/scripts/login.js"></script>
        <script>
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('Service Worker registrado:', registration);
                }).catch(error => {
                    console.error('Error registrando Service Worker:', error);
                });
            }
        </script>
    </html>
