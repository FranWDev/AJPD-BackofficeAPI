        <meta name="description" content="Asociación Juvenil Proyecto Dubini">
        <title>Editar Imágenes Slider - Proyecto Dubini</title>
        <link rel="stylesheet" href="/styles/layout/header.css">
        <link rel="stylesheet" href="/styles/layout/footer.css">
        <link rel="stylesheet" href="/styles/base.css">
        <link rel="stylesheet" href="/styles/slider-editor.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <body>
        <div th:replace="fragments/header :: header"></div>
        <main role="main">
            <h1>🎠 Editor de Imágenes Slider</h1>
            <div class="slider-editor-container">
                <div class="slider-cards-grid">
                    <!-- Slide 1 -->
                    <div class="slider-card">
                        <div class="slider-card-header">
                            <h2>Slide 1</h2>
                        </div>
                        <div class="image-preview-container">
                            <img id="preview-slide1" src="https://mcybqxqlujczgclidnar.supabase.co/storage/v1/object/public/ajpd-storage/slider/slide1.webp" alt="Vista previa de Slide 1" class="slider-preview">
                            <div class="loading-spinner" id="spinner-slide1" style="display: none;"></div>
                        </div>
                        <div class="form-section">
                            <input 
                                type="file" 
                                id="file-slide1" 
                                accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                                class="file-input"
                            >
                            <label for="file-slide1" class="file-label">
                                <i class="fas fa-cloud-upload-alt"></i>
                                Seleccionar imagen
                            </label>
                            <div id="status-slide1" class="status-message"></div>
                            <div class="button-group">
                                <button class="btn btn-primary" id="btn-upload-slide1">
                                    <i class="fas fa-arrow-up"></i>
                                    Actualizar
                                </button>
                            </div>
                        </div>
                        <div class="caption-section">
                            <label for="caption-slide1" class="caption-label">
                                <i class="fas fa-align-left"></i>
                                Pie de texto
                            </label>
                            <textarea 
                                id="caption-slide1" 
                                class="caption-textarea"
                                placeholder="Escribe el pie de texto para este slide (máximo 150 caracteres)..."
                                rows="6"
                            ></textarea>
                            <div class="caption-info">
                                <span id="char-count-slide1" class="char-count">0 / 5000</span>
                            </div>
                            <button class="btn btn-secondary" id="btn-caption-slide1">
                                <i class="fas fa-save"></i>
                                Guardar pie de texto
                            </button>
                            <div id="caption-status-slide1" class="status-message"></div>
                        </div>
                    </div>
