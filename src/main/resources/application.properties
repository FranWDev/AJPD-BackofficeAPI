# ============================================
# APPLICATION INFO
# ============================================
spring.application.name=backofficeAPI
server.port=${PORT:8081}
server.servlet.context-path=/
spring.config.import=optional:dotenv:

# OPTIMIZACIÓN: Lazy initialization reduce el tiempo de inicio significativamente
spring.main.lazy-initialization=true
spring.jmx.enabled=false

# OPTIMIZACIÓN: Desactiva inicialización en background
spring.main.register-shutdown-hook=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# ============================================
# LOGGING - OPTIMIZADO PARA PRODUCCIÓN
# ============================================
logging.level.root=WARN
logging.level.org.dubini.backofficeAPI=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jdbc=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/tmp/storage/logs/backoffice-api.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# JWT
jwt.secret=${JWT_SECRET}

# Access key hash
security.access.key-hash=${ACCESS_KEY_HASH}

# Límite de tamaño de archivo
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ============================================
# JACKSON JSON CONFIGURATION
# ============================================
spring.jackson.serialization.indent-output=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Madrid
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ============================================
# DEVTOOLS (Disabled in production)
# ============================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ============================================
# ERROR HANDLING
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# ACTUATOR (Optimizado)
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false
management.health.defaults.enabled=true
management.health.diskspace.enabled=false

# ============================================
# THYMELEAF (Optimizado para producción)
# ============================================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# INTERNATIONALIZATION
# ============================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.web.locale=es_ES
spring.web.locale-resolver=fixed

# ============================================
# BANNER
# ============================================
spring.banner.location=classpath:banner.txt

uploadme.base-url=https://uploadme.me
uploadme.api-key=chv_g0_ec6e00247ad5a93730560d716b03b40d87f840d2cb101b668ecc4b6912d9727a47e297f718c0dc1d00436dd9cbf73c4dd5847091428359115389cd45c3f6f2b3

# ============================================
# POSTGRES
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=0

# ============================
# FRONTEND API URL
# ============================
frontend.api.url=${FRONTEND_API_URL}

# ============================
# SUPABASE STORAGE
# ============================
supabase.api=${SUPABASE_API_URL}
supabase.bucket=${SUPABASE_NAME}
supabase.key=${SUPABASE_KEY}