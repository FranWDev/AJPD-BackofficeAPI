name: Build and Push Ultra-Light Native Image

on:
  push:
    branches: [main, production, development]
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Static Libraries and UPX
        run: |
          sudo apt-get update
          # libc6-dev es IMPRESCINDIBLE para el enlace estático de glibc
          sudo apt-get install -y zlib1g-dev libc6-dev upx-ucl

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
          
      - name: Build Native Binary (Static)
        # Usamos clean package para evitar la doble compilación de native:compile
        run: |
          chmod +x mvnw
          ./mvnw -Pnative clean package -DskipTests \
          -Dspring-boot.native.build-args="--static --libc=glibc"

      - name: Compress Binary with UPX
        # Comprimimos el binario antes de enviarlo al contexto de Docker
        run: upx --best target/backofficeAPI

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.native-simple
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backoffice-native:latest
            ${{ secrets.DOCKER_USERNAME }}/backoffice-native:${{ github.sha }}
          # Usamos caché de GitHub Actions para Docker para que las capas se suban rápido
          cache-from: type=gha
          cache-to: type=gha,mode=max